<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Testes de regras e IA</title>
<style>
  :root { --bg:#fbf7ef; --ink:#1d160f; --ok:#1d6b35; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16120e; --ink:#efe6d6; --ok:#6fd08c; --bad:#ff8a80; } }
  body { margin: 16px; background: var(--bg); color: var(--ink); font: 13px/1.45 Consolas, "Cascadia Mono", monospace; }
  h1 { font: 600 18px/1.2 system-ui, sans-serif; margin: 0 0 8px; }
  pre { white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<h1>Jogo da Onça — testes de regras + IA (dev/logic.js)</h1>
<pre id="out">executando…</pre>
<script>
  window.__errors = [];
  window.addEventListener('error', function (e) { window.__errors.push('error: ' + e.message + ' @' + (e.filename || '') + ':' + e.lineno); });
  window.addEventListener('unhandledrejection', function (e) { window.__errors.push('unhandledrejection: ' + (e.reason && (e.reason.stack || e.reason))); });
</script>
<script src="../../codigo/logica.js"></script>
<script>
(function () {
  'use strict';
  var L = window.OncaLogic;
  var lines = [], nPass = 0, nFail = 0, failures = [], notes = [];
  var outEl = document.getElementById('out');
  var tStart = performance.now();
  var syncMs = 0, finished = false;

  function render(status) {
    var head = 'SUMMARY: ' + nPass + ' passed, ' + nFail + ' failed' + (status ? '  [' + status + ']' : '') +
      '\nsync tests: ' + (syncMs / 1000).toFixed(1) + ' s' +
      (failures.length ? '\nFAILED: ' + failures.join(' | ') : '') +
      (window.__errors.length ? '\nPAGE ERRORS: ' + window.__errors.join(' | ') : '') +
      (notes.length ? '\n\nNOTES:\n' + notes.join('\n') : '');
    outEl.textContent = head + '\n\n' + lines.join('\n');
  }
  function test(name, fn) {
    var t0 = performance.now();
    try {
      var info = fn();
      nPass++;
      lines.push('PASS  ' + name + (info ? '  -- ' + info : '') + '  (' + (performance.now() - t0).toFixed(0) + ' ms)');
    } catch (e) {
      nFail++;
      failures.push(name);
      lines.push('FAIL  ' + name + ': ' + (e && e.message) + (e && e.stack ? '\n        ' + String(e.stack).split('\n').slice(1, 4).join('\n        ') : ''));
    }
  }
  function assert(c, msg) { if (!c) throw new Error(msg || 'assertion failed'); }
  function eq(a, b, msg) {
    var ja = JSON.stringify(a), jb = JSON.stringify(b);
    if (ja !== jb) throw new Error((msg || 'not equal') + ': ' + ja + ' !== ' + jb);
  }
  function throws(fn, msg) {
    var ok = false;
    try { fn(); } catch (e) { ok = true; }
    if (!ok) throw new Error((msg || 'expected an Error') + ' (nothing thrown)');
  }
  function I(r, c) { var i = L.index(r, c); if (i < 0) throw new Error('bad point ' + r + ',' + c); return i; }
  function mk(o) {
    var b = [], k;
    for (k = 0; k < L.N; k++) b.push(0);
    o.dogs.forEach(function (d) { if (b[d] !== 0) throw new Error('duplicate dog ' + d); b[d] = 1; });
    if (b[o.jaguar] !== 0) throw new Error('jaguar placed on a dog');
    b[o.jaguar] = 2;
    // default 'captured' = consistent count when >= 10 dogs, otherwise 0 (sparse test boards)
    return { board: b, jaguar: o.jaguar, captured: o.captured !== undefined ? o.captured : (o.dogs.length >= 10 ? 14 - o.dogs.length : 0),
             turn: o.turn || 'J', ply: o.ply || 0, chain: o.chain || 0 };
  }
  function norm(m) {
    if (!m) return m;
    if (m.type === 'capture') return { type: 'capture', path: m.path.slice(), captured: m.captured.slice() };
    return { type: m.type, from: m.from, to: m.to };
  }
  function key(m) { return JSON.stringify(norm(m)); }
  function setKey(list) { return list.map(key).sort().join('|'); }
  function isLegal(s, m) {
    if (!m) return false;
    var k = key(m);
    return L.legalMoves(s).some(function (x) { return key(x) === k; });
  }
  function deepFreeze(o) {
    if (o && typeof o === 'object' && !Object.isFrozen(o)) { Object.freeze(o); Object.keys(o).forEach(function (k) { deepFreeze(o[k]); }); }
    return o;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function randomGame(rand, plies) {
    var s = L.initialState(), hist = [L.positionKey(s)];
    for (var k = 0; k < plies; k++) {
      if (L.winner(s)) break;
      var ms = L.legalMoves(s);
      if (!ms.length) break;
      s = L.applyMove(s, ms[Math.floor(rand() * ms.length)]);
      hist.push(L.positionKey(s));
    }
    return { state: s, history: hist };
  }
  function randomPositions(seed, count, maxPlies) {
    var rand = mulberry32(seed), res = [], guard = 0;
    while (res.length < count && guard++ < count * 20) {
      var g = randomGame(rand, Math.floor(rand() * maxPlies));
      if (L.winner(g.state) === null) res.push(g);
    }
    return res;
  }
  function world(i) { return { x: L.NODES[i].c - 2, z: L.NODES[i].r - 3 }; }
  function countDogs(s) { return s.board.filter(function (v) { return v === 1; }).length; }

  /* ================================================================ geometry */
  test('geometria: 31 pontos, indices (r,c) e pontos invalidos', function () {
    eq(L.N, 31, 'N'); eq(L.NODES.length, 31, 'NODES.length');
    for (var i = 0; i < 25; i++) eq(L.NODES[i], { r: Math.floor(i / 5), c: i % 5 }, 'grid node ' + i);
    eq(L.NODES.slice(25), [{ r: 5, c: 1 }, { r: 5, c: 2 }, { r: 5, c: 3 }, { r: 6, c: 0 }, { r: 6, c: 2 }, { r: 6, c: 4 }], 'toca nodes');
    for (i = 0; i < 31; i++) eq(L.index(L.NODES[i].r, L.NODES[i].c), i, 'round trip ' + i);
    [[5, 0], [5, 4], [6, 1], [6, 3], [7, 2], [-1, 0], [0, 5], [0, -1], [1.5, 2], ['1', 2], [null, 1]].forEach(function (p) {
      eq(L.index(p[0], p[1]), -1, 'index(' + p + ')');
    });
    assert(Object.isFrozen(L.NODES) && Object.isFrozen(L.NODES[0]), 'NODES frozen');
  });

  test('geometria: 66 arestas = 40 ortogonais + 16 diagonais + 10 da toca, sem duplicatas', function () {
    eq(L.EDGES.length, 66, 'EDGES.length');
    var seen = {}, ortho = 0, diag = 0, toca = 0;
    L.EDGES.forEach(function (e) {
      assert(e.length === 2 && e[0] >= 0 && e[1] < 31 && e[0] !== e[1], 'edge ' + e);
      var k = Math.min(e[0], e[1]) + '-' + Math.max(e[0], e[1]);
      assert(!seen[k], 'duplicate edge ' + k); seen[k] = 1;
      var a = L.NODES[e[0]], b = L.NODES[e[1]];
      if (e[0] >= 25 || e[1] >= 25) toca++;
      else if (Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1) ortho++;
      else if (Math.abs(a.r - b.r) === 1 && Math.abs(a.c - b.c) === 1) diag++;
      else throw new Error('weird edge ' + e);
    });
    eq([ortho, diag, toca], [40, 16, 10], 'by category');
    var tocaList = [[4, 2, 5, 1], [4, 2, 5, 2], [4, 2, 5, 3], [5, 1, 5, 2], [5, 2, 5, 3], [5, 1, 6, 0], [5, 2, 6, 2], [5, 3, 6, 4], [6, 0, 6, 2], [6, 2, 6, 4]];
    tocaList.forEach(function (t) {
      var a = I(t[0], t[1]), b = I(t[2], t[3]);
      assert(seen[Math.min(a, b) + '-' + Math.max(a, b)], 'missing toca edge ' + t);
    });
  });

  test('geometria: ADJ simetrica, igual a EDGES, graus', function () {
    var sum = 0;
    for (var a = 0; a < 31; a++) {
      sum += L.ADJ[a].length;
      L.ADJ[a].forEach(function (b) { assert(L.ADJ[b].indexOf(a) >= 0, 'asymmetric ' + a + '-' + b); });
    }
    eq(sum, 132, 'sum of degrees');
    L.EDGES.forEach(function (e) { assert(L.ADJ[e[0]].indexOf(e[1]) >= 0, 'edge not in ADJ ' + e); });
    var deg = function (r, c) { return L.ADJ[I(r, c)].length; };
    eq([deg(2, 2), deg(0, 0), deg(0, 1), deg(1, 1), deg(4, 2), deg(4, 0), deg(5, 1), deg(5, 2), deg(5, 3), deg(6, 0), deg(6, 2), deg(6, 4)],
       [8, 3, 3, 8, 8, 3, 3, 4, 3, 2, 3, 2], 'degrees');
  });

  test('geometria: diagonais so entre pontos com (r+c) par', function () {
    L.EDGES.forEach(function (e) {
      if (e[0] >= 25 || e[1] >= 25) return;
      var a = L.NODES[e[0]], b = L.NODES[e[1]];
      if (a.r !== b.r && a.c !== b.c) assert((a.r + a.c) % 2 === 0 && (b.r + b.c) % 2 === 0, 'odd diagonal ' + e);
    });
    for (var r = 0; r < 4; r++) for (var c = 0; c < 4; c++) {
      var d1 = L.ADJ[I(r, c)].indexOf(I(r + 1, c + 1)) >= 0, d2 = L.ADJ[I(r, c + 1)].indexOf(I(r + 1, c)) >= 0;
      assert(d1 !== d2, 'exactly one diagonal per cell ' + r + ',' + c);
    }
  });

  function hasJump(a, o, t) { return L.JUMPS[a].some(function (j) { return j.over === o && j.to === t; }); }

  test('geometria: exemplos de pulo do enunciado existem', function () {
    var ex = [[[6, 0], [6, 2], [6, 4]], [[5, 1], [5, 2], [5, 3]], [[3, 1], [4, 2], [5, 3]], [[2, 2], [3, 2], [4, 2]],
              [[3, 2], [4, 2], [5, 2]], [[4, 2], [5, 2], [6, 2]]];
    ex.forEach(function (x) {
      assert(hasJump(I(x[0][0], x[0][1]), I(x[1][0], x[1][1]), I(x[2][0], x[2][1])), 'missing jump ' + JSON.stringify(x));
      assert(hasJump(I(x[2][0], x[2][1]), I(x[1][0], x[1][1]), I(x[0][0], x[0][1])), 'missing reverse jump ' + JSON.stringify(x));
    });
  });

  test('geometria: pulos retos, simetricos, dentro do tabuleiro e = busca geometrica exaustiva', function () {
    var total = 0, mine = {}, brute = {};
    for (var a = 0; a < 31; a++) L.JUMPS[a].forEach(function (j) {
      total++;
      assert(j.over >= 0 && j.over < 31 && j.to >= 0 && j.to < 31, 'jump leaves the board ' + a + '/' + JSON.stringify(j));
      assert(L.ADJ[a].indexOf(j.over) >= 0 && L.ADJ[j.over].indexOf(j.to) >= 0, 'jump not along edges');
      var A = world(a), B = world(j.over), C = world(j.to);
      assert(B.x - A.x === C.x - B.x && B.z - A.z === C.z - B.z, 'jump not straight/equal ' + a + '>' + j.to);
      assert(hasJump(j.to, j.over, a), 'reverse missing');
      mine[a + '>' + j.over + '>' + j.to] = 1;
    });
    // exhaustive: two consecutive edges with the same world direction and length
    for (a = 0; a < 31; a++) L.ADJ[a].forEach(function (b) {
      L.ADJ[b].forEach(function (c) {
        if (c === a) return;
        var A = world(a), B = world(b), C = world(c);
        if (B.x - A.x === C.x - B.x && B.z - A.z === C.z - B.z) brute[a + '>' + b + '>' + c] = 1;
      });
    });
    eq(Object.keys(mine).sort(), Object.keys(brute).sort(), 'JUMPS vs brute force');
    return total + ' jumps';
  });

  test('geometria: pulos a partir de (6,0) (6,2) (6,4) (5,1) (5,2) (5,3) (4,2)', function () {
    function js(r, c) {
      return L.JUMPS[I(r, c)].map(function (j) { return L.NODES[j.over].r + ',' + L.NODES[j.over].c + '>' + L.NODES[j.to].r + ',' + L.NODES[j.to].c; }).sort();
    }
    eq(js(6, 0), ['5,1>4,2', '6,2>6,4'], '(6,0)');
    eq(js(6, 4), ['5,3>4,2', '6,2>6,0'], '(6,4)');
    eq(js(6, 2), ['5,2>4,2'], '(6,2)');
    eq(js(5, 1), ['4,2>3,3', '5,2>5,3'], '(5,1)');
    eq(js(5, 3), ['4,2>3,1', '5,2>5,1'], '(5,3)');
    eq(js(5, 2), ['4,2>3,2'], '(5,2)');
    eq(js(4, 2), ['3,1>2,0', '3,2>2,2', '3,3>2,4', '4,1>4,0', '4,3>4,4', '5,1>6,0', '5,2>6,2', '5,3>6,4'], '(4,2)');
  });

  test('geometria: linhas da toca continuam as diagonais e a linha central (mapeamento 3D)', function () {
    [[[2, 0], [3, 1], [4, 2], [5, 3], [6, 4]], [[2, 4], [3, 3], [4, 2], [5, 1], [6, 0]], [[0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [5, 2], [6, 2]]].forEach(function (line) {
      for (var k = 1; k < line.length; k++) {
        var a = I(line[k - 1][0], line[k - 1][1]), b = I(line[k][0], line[k][1]);
        assert(L.ADJ[a].indexOf(b) >= 0, 'not an edge ' + line[k - 1] + '-' + line[k]);
        if (k > 1) {
          var p = I(line[k - 2][0], line[k - 2][1]);
          var A = world(p), B = world(a), C = world(b);
          assert(B.x - A.x === C.x - B.x && B.z - A.z === C.z - B.z, 'not straight at ' + line[k]);
        }
      }
    });
    var t = world(I(6, 0)), g = world(I(0, 0));
    eq([g.x, g.z, t.x, t.z], [-2, -3, -2, 3], 'world coordinates');
  });

  /* ================================================================ state & moves */
  test('estado inicial: 14 caes, onca no 12, vez da onca', function () {
    var s = L.initialState();
    eq(s.jaguar, 12); eq(s.board[12], 2); eq(s.turn, 'J'); eq(s.captured, 0); eq(s.ply, 0);
    eq(countDogs(s), 14, 'dogs');
    for (var i = 0; i < 31; i++) if (i !== 12) eq(s.board[i], L.NODES[i].r <= 2 ? 1 : 0, 'point ' + i);
    eq(L.winner(s), null);
    var k = L.positionKey(s);
    eq(k.length, 32); eq(k.charAt(31), 'J');
    eq(k, '11111111111121100000000000000000'.slice(0, 31) + 'J');
    assert(JSON.parse(JSON.stringify(s)).board.length === 31, 'JSON serialisable');
    var c = L.cloneState(s); c.board[0] = 0;
    eq(s.board[0], 1, 'clone is deep');
  });

  test('geracao de lances: posicao inicial', function () {
    var s = L.initialState();
    eq(L.jaguarSteps(s), [16, 17, 18]);
    eq(L.jaguarCaptures(s), []);
    eq(setKey(L.legalMoves(s)), setKey([16, 17, 18].map(function (t) { return { type: 'step', from: 12, to: t }; })));
    var d = L.applyJaguarStep(s, 17);
    eq(d.turn, 'D'); eq(d.ply, 1);
    var dm = L.dogMoves(d).map(function (m) { return m.from + '>' + m.to; }).sort();
    eq(dm, ['10>15', '10>16', '11>12', '11>16', '13>12', '13>18', '14>18', '14>19', '6>12', '7>12', '8>12'].sort(), 'dog moves after J 12>17');
    eq(L.dogMoves(s).length, 6, 'dog moves at the very start (geometry only)');
  });

  test('geracao de lances: posicoes montadas (grade e toca)', function () {
    var s = mk({ jaguar: 12, dogs: [7, 17] });
    eq(L.jaguarCaptures(s), [{ over: 7, to: 2 }, { over: 17, to: 22 }].sort(function (a, b) { return a.over - b.over; }));
    eq(L.jaguarSteps(s).length, 6);
    s = mk({ jaguar: 12, dogs: [17, 22] });
    eq(L.jaguarCaptures(s), [], 'blocked landing');
    s = mk({ jaguar: 22, dogs: [25, 26, 27] });
    eq(L.jaguarCaptures(s).map(function (c) { return c.over + '>' + c.to; }).sort(), ['25>28', '26>29', '27>30']);
    s = mk({ jaguar: 28, dogs: [25, 29] });
    eq(L.jaguarCaptures(s).map(function (c) { return c.over + '>' + c.to; }).sort(), ['25>22', '29>30']);
    eq(L.jaguarSteps(s), [], 'no steps from (6,0) when both neighbours are dogs');
    s = mk({ jaguar: 0, dogs: [29], turn: 'D' });
    eq(L.dogMoves(s).map(function (m) { return m.to; }).sort(), [26, 28, 30]);
    s = mk({ jaguar: 22, dogs: [17] });
    eq(L.jaguarCaptures(s, 2), [{ over: 7, to: 12 }].filter(function () { return false; }), 'from=2 without dog at 7');
    s = mk({ jaguar: 22, dogs: [7] });
    eq(L.jaguarCaptures(s, 2), [{ over: 7, to: 12 }], 'explicit from parameter');
  });

  test('captura simples: tabuleiro, contagem, turno nao passa', function () {
    var s = mk({ jaguar: 12, dogs: [17, 0, 1] });
    var a = L.applyJaguarCapture(s, 17, 22);
    eq(a.board[12], 0); eq(a.board[17], 0); eq(a.board[22], 2); eq(a.jaguar, 22);
    eq(a.captured, s.captured + 1); eq(a.turn, 'J'); eq(a.ply, s.ply); eq(a.chain, 1);
    var e = L.endJaguarTurn(a);
    eq(e.turn, 'D'); eq(e.ply, s.ply + 1); eq(e.chain, 0);
  });

  // chain 0 -> 2 -> 12 -> 22 over 1, 7, 17
  var chainPos = mk({ jaguar: 0, dogs: [1, 7, 17, 20, 24] });

  test('captura multipla: prefixos em legalMoves', function () {
    var ms = L.legalMoves(chainPos);
    var caps = ms.filter(function (m) { return m.type === 'capture'; });
    eq(setKey(caps), setKey([
      { type: 'capture', path: [0, 2], captured: [1] },
      { type: 'capture', path: [0, 2, 12], captured: [1, 7] },
      { type: 'capture', path: [0, 2, 12, 22], captured: [1, 7, 17] }
    ]));
    eq(ms.filter(function (m) { return m.type === 'step'; }).map(function (m) { return m.to; }).sort(), [5, 6]);
  });

  test('captura multipla: passo a passo (chain, sem passos no meio, endJaguarTurn)', function () {
    var a = L.applyJaguarCapture(chainPos, 1, 2);
    eq([a.turn, a.chain, a.captured, a.ply], ['J', 1, chainPos.captured + 1, 0]);
    eq(L.jaguarSteps(a), [], 'no steps mid-chain');
    eq(L.jaguarCaptures(a), [{ over: 7, to: 12 }]);
    eq(L.winner(a), null);
    throws(function () { L.applyJaguarStep(a, 1); }, 'step after capture must throw');
    eq(setKey(L.legalMoves(a)), setKey([{ type: 'capture', path: [2, 12], captured: [7] }, { type: 'capture', path: [2, 12, 22], captured: [7, 17] }]), 'mid-chain legal moves');
    var b = L.applyJaguarCapture(a, 7, 12);
    var c = L.applyJaguarCapture(b, 17, 22);
    eq([c.jaguar, c.captured, c.chain, c.turn], [22, chainPos.captured + 3, 3, 'J']);
    eq(L.jaguarCaptures(c), []);
    var e = L.endJaguarTurn(c);
    eq([e.turn, e.ply, e.chain], ['D', 1, 0]);
    throws(function () { L.endJaguarTurn(chainPos); }, 'cannot pass without capturing');
    throws(function () { L.endJaguarTurn(e); }, 'endJaguarTurn on dogs turn');
  });

  test('captura multipla: applyMove com cadeia completa e com prefixo', function () {
    var full = L.applyMove(chainPos, { type: 'capture', path: [0, 2, 12, 22], captured: [1, 7, 17] });
    var manual = L.endJaguarTurn(L.applyJaguarCapture(L.applyJaguarCapture(L.applyJaguarCapture(chainPos, 1, 2), 7, 12), 17, 22));
    eq(full, manual, 'full chain');
    var pre = L.applyMove(chainPos, { type: 'capture', path: [0, 2], captured: [1] });
    eq([pre.jaguar, pre.turn, pre.captured, pre.board[7]], [2, 'D', chainPos.captured + 1, 1], 'prefix');
    var noCap = L.applyMove(chainPos, { type: 'capture', path: [0, 2, 12] });
    eq(noCap.jaguar, 12, 'captured list optional');
    throws(function () { L.applyMove(chainPos, { type: 'capture', path: [0, 2, 12], captured: [1, 6] }); }, 'wrong captured list');
    throws(function () { L.applyMove(chainPos, { type: 'capture', path: [0, 2, 22] }); }, 'invalid path');
  });

  test('captura multipla: ramificacao e laco que volta a casa de origem', function () {
    // loop 12 -> 14 -> 4 -> 2 -> 12 over 13, 9, 3, 7 (and the reverse loop)
    var s = mk({ jaguar: 12, dogs: [13, 9, 3, 7, 20] });
    var ms = L.legalMoves(s).filter(function (m) { return m.type === 'capture'; });
    var loop = ms.filter(function (m) { return m.path.length === 5 && m.path[4] === 12; });
    eq(loop.length, 2, 'two loop chains');
    var after = L.applyMove(s, loop[0]);
    eq([after.jaguar, after.captured, countDogs(after), after.turn], [12, s.captured + 4, 1, 'D']);
    // branching: from 12 both 12>14 (over 13) and 12>2 (over 7)
    var firsts = {};
    ms.forEach(function (m) { firsts[m.path[1]] = 1; });
    eq(Object.keys(firsts).sort(), ['14', '2'], 'two first jumps');
    // search random boards for a chain that lands on a point whose dog it captured earlier
    var rand = mulberry32(5150), found = null, tries = 0, ai = L.createAI();
    while (!found && tries++ < 30000) {
      var j = Math.floor(rand() * 31), dogs = [];
      for (var p = 0; p < 31; p++) if (p !== j && rand() < 0.45) dogs.push(p);
      var bs = mk({ jaguar: j, dogs: dogs, captured: 0 });
      L.legalMoves(bs).some(function (m) {
        if (m.type !== 'capture') return false;

  // Note: under headless --virtual-time-budget the virtual clock races ahead (>100x) while the main
  // thread is idle, also inside the Worker. So the async tests use huge virtual timeouts and the
  // run is bounded by the budget (use --virtual-time-budget=600000).
  var BIG = 5000000;

  /* ================================================================ async: real Worker */
  function asyncTest(name, fn, timeoutMs) {
    return new Promise(function (resolve) {
      var t0 = performance.now(), done = false;
      var timer = setTimeout(function () {
        if (done) return; done = true;
        nFail++; failures.push(name); lines.push('FAIL  ' + name + ': timeout ' + timeoutMs + ' ms'); resolve();
      }, timeoutMs);
      Promise.resolve().then(fn).then(function (info) {
        if (done) return; done = true; clearTimeout(timer);
        nPass++; lines.push('PASS  ' + name + (info ? '  -- ' + info : '') + '  (' + (performance.now() - t0).toFixed(0) + ' ms)'); resolve();
      }, function (e) {
        if (done) return; done = true; clearTimeout(timer);
        nFail++; failures.push(name); lines.push('FAIL  ' + name + ': ' + (e && e.message)); resolve();
      });
    });
  }

  asyncTest('worker real: Blob Worker criado a partir de workerSource() (file://)', function () {
    return new Promise(function (resolve, reject) {
      var w = L.createWorker();
      if (!w) { reject(new Error('createWorker() returned null')); return; }
      var s = L.applyJaguarStep(L.initialState(), 16);
      w.onmessage = function (e) {
        var d = e.data;
        try {
          assert(d.id === 7, 'id echo');
          assert(isLegal(s, d.move), 'legal move from the worker: ' + JSON.stringify(d.move));
          assert(typeof d.stats.depth === 'number' && typeof d.stats.nodes === 'number' && typeof d.stats.ms === 'number', 'stats');
          notes.push('- REAL Blob Worker from file:// in headless Chrome: WORKS (reply ' + JSON.stringify(d.move) + ', stats ' + JSON.stringify(d.stats) + ')');
          w.terminate();
          resolve('reply ' + JSON.stringify(d.move) + ' depth ' + d.stats.depth);
        } catch (err) { reject(err); }
      };
      w.onerror = function (e) { reject(new Error('worker error: ' + (e.message || e))); };
      w.postMessage({ id: 7, state: s, level: 3, history: [], timeLimitMs: 600 });
    });
  }, BIG).then(function () {
    return asyncTest('chooseMoveAsync: resolve com lance legal (via Worker)', function () {
      var s = L.initialState();
      return L.chooseMoveAsync(s, 2, { history: [L.positionKey(s)], watchdogMs: BIG }).then(function (r) {
        assert(isLegal(s, r.move), 'legal');
        assert(r.worker === true, 'answer did not come from the Worker');
        return 'worker=' + !!r.worker + ' move ' + JSON.stringify(r.move) + ' stats ' + JSON.stringify(r.stats);
      });
    }, BIG);
  }).then(function () {
    return asyncTest('chooseMoveAsync: fallback sem Worker (useWorker:false)', function () {

      return L.chooseMoveAsync(s, 3, { useWorker: false, timeLimitMs: 200 }).then(function (r) {

      });
    }, BIG);
  }).then(function () {
    finished = true;

    render('done in ' + ((performance.now() - tStart) / 1000).toFixed(1) + ' s');
  });
})();
</script>
